<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1d - Multiple merges on different events</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc 
                src="do-merge/emc.json" 
        ></script>
    </be-hive>
</head>
<body>
    <script type=module>
        import 'be-hive/be-hive.js';
        class MoodStone extends HTMLElement{
            #isHappy;
            get isHappy(){
                return this.#isHappy;
            }
            set isHappy(nv){
                this.#isHappy = nv;
                this.querySelector('#happy').textContent = nv ? '😊' : '😢'
            }
            #age;
            get age(){
                return this.#age;
            }
            set age(nv){
                this.#age = nv;
                this.querySelector('#age').textContent = nv;

            }
            connectedCallback(){
                this.isHappy = true;
                this.age = 0;
            }
        }
        customElements.define('mood-stone', MoodStone);
    </script>
    <mood-stone itemscope>
    <div>
        Is Happy: <span id=happy></span>
        Age: <span id=age></span>
    </div>
    <button do-merge='[
        {
            "assign": {
                "?.isHappy =!": ".",
                "?.age +=": 10,
                "?.classList?.add": "my-class"
            },
            "options": {
                "withMethods": ["add"]
            },
            "on": "mouseover"
        },{
            "assign": {
                "?.age +=": -10
            }
        }
    ]'>Merge</button>
    </mood-stone>
</body>
</html>
